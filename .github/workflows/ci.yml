name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.3.13' # minimum supported version
          - '4.0'

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run specs
        run: bundle exec rspec

      - name: Load with warnings enabled
        run: ruby -w -Ilib -e 'require "dmarcator"'

      - name: Check documentation
        run: bundle exec yard doc --no-output --fail-on-warning

      - name: Build gem
        run: gem build dmarc.gemspec
