name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Pinned rather than ubuntu-latest: the label is migrating from 24.04 to
    # 26.04 between 2026-10-19 and 2026-11-19, so runs can otherwise land on
    # different images with different Ruby versions available.
    # https://github.com/actions/runner-images/issues/14748
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.3.13' # minimum supported version
          - '4.0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run specs
        run: bundle exec rspec

      - name: Check action pinning
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          fix: 'false'

      # Must run under bundler: on CI the gems live in vendor/bundle, so a
      # bare `ruby` cannot resolve parslet.
      - name: Load with warnings enabled
        run: |
          bundle exec ruby -w -e 'require "dmarcator"' 2> warnings.log
          if grep -q 'dmarcator' warnings.log; then
            echo '::error::dmarcator emitted warnings'
            cat warnings.log
            exit 1
          fi

      - name: Check documentation
        run: bundle exec yard doc --no-output --fail-on-warning

      - name: Build gem
        run: gem build dmarc.gemspec
