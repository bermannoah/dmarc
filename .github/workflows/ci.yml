name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.3.13' # minimum supported version
          - '4.0'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@e1bd6146574da5e0795075b5319b300edb30c5b0 # v1.333.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run specs
        run: bundle exec rspec

      - name: Check action pinning
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          fix: 'false'

      # Must run under bundler: on CI the gems live in vendor/bundle, so a
      # bare `ruby` cannot resolve parslet.
      - name: Load with warnings enabled
        run: |
          bundle exec ruby -w -e 'require "dmarcator"' 2> warnings.log
          if grep -q 'dmarcator' warnings.log; then
            echo '::error::dmarcator emitted warnings'
            cat warnings.log
            exit 1
          fi

      - name: Check documentation
        run: bundle exec yard doc --no-output --fail-on-warning

      - name: Build gem
        run: gem build dmarc.gemspec
